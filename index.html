<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NsfwTapes - The latest and greatest tapes</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #0d0a08;
      background-image: 
        radial-gradient(ellipse at center, rgba(42, 31, 26, 0.75) 0%, rgba(13, 10, 8, 0.92) 70%),
        url('background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 50px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    /* Promo card */
    .promo {
      background: #1a1614;
      border-radius: 18px;
      padding: 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
      animation: pop 3s ease-in-out infinite;
    }

    @keyframes pop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .promo img {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .promo-text h2 {
      font-size: 21px;
      font-weight: 600;
      margin-bottom: 5px;
      letter-spacing: 0.2px;
    }

    .promo-text p {
      font-size: 14.5px;
      color: #c2b8ae;
      line-height: 1.4;
    }

    /* Shared item style */
    .item, .button-link {
      background: #1a1614;
      border-radius: 16px;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
      transition: all 0.22s ease;
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .item-header, .button-link {
      display: flex;
      align-items: center;
      padding: 18px 20px;
      gap: 15px;
      cursor: pointer;
      user-select: none;
    }

    .item-header:hover, .button-link:hover {
      background: #221e1b;
      transform: translateY(-1px);
    }

    .item-icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .item-icon svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
    }

    .item-title {
      flex: 1;
      font-size: 17px;
      font-weight: 500;
    }

    .chevron {
      width: 18px;
      height: 18px;
      transition: transform 0.28s ease;
      opacity: 0.7;
    }

    .item.open .chevron {
      transform: rotate(180deg);
    }

    /* Badges */
    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 6px 13px;
      border-radius: 50px;
      white-space: nowrap;
      letter-spacing: 0.3px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      animation: badgePulse 2.6s ease-in-out infinite;
    }

    .badge.red {
      background: linear-gradient(135deg, #ff4757, #e84118);
      color: #ffffff;
    }

    .badge.green {
      background: linear-gradient(135deg, #2ed573, #1eae5a);
      color: #ffffff;
    }

    @keyframes badgePulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      }
      50% {
        transform: scale(1.06);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.45);
      }
    }

    /* Dropdown */
    .item-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
      background: transparent;
    }

    .item.open .item-content {
      max-height: 420px;
    }

    .item-content-inner {
      padding: 10px 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-content a {
      display: block;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 11px;
      padding: 13px 16px;
      color: #d8d0c8;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .item-content a:hover {
      background: rgba(255, 255, 255, 0.11);
      border-color: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      transform: translateY(-1px);
    }

    @media (max-width: 480px) {
      .container {
        max-width: 100%;
      }
      body {
        padding: 40px 16px 30px;
      }
    }
  </style>
</head>
